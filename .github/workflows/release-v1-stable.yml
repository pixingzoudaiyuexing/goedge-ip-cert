name: Release v1.0.0 Stable
on: push
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-v1.0.0.sh
