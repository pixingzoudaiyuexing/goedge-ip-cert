name: Release v1.0.0 Stable

on:
  push:
    branches:
      - main
    paths:
      - .release-v1.0.0-trigger

permissions:
  contents: write

concurrency:
  group: release-v1.0.0-stable
  cancel-in-progress: false

jobs:
  release:
    if: github.event.head_commit.message == 'chore: trigger v1.0.0 release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Prepare v1.0.0 source
        run: python3 scripts/prepare-v1.0.0.py

      - name: Validate source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'readonly RELEASE_TAG="v1.0.0"' install.sh
          grep -F 'const version = "v1.0.0"' cmd/goedge-ip-cert/main.go
          grep -F 'prerelease == false' install.sh
          grep -F '点击一次「保存」（无需提前选择证书）' install.sh
          ! grep -q 'Status: Preview' README.md

      - name: Verify modules
        run: go mod verify

      - name: Go tests
        run: go test -count=1 ./...

      - name: Race tests
        run: go test -race -count=1 ./...

      - name: Go vet
        run: go vet ./...

      - name: ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck install.sh tests/installer_test.sh scripts/secret-scan.sh

      - name: Installer tests
        run: bash tests/installer_test.sh

      - name: Secret scan
        run: sh scripts/secret-scan.sh

      - name: Govulncheck
        shell: bash
        run: |
          set -Eeuo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Commit stable source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-v1.0.0.yml
          git rm .github/workflows/release-v1-stable.yml
          git rm scripts/prepare-v1.0.0.py
          git rm .release-v1.0.0-trigger
          git add cmd/goedge-ip-cert/main.go install.sh README.md docs/INSTALL.md CHANGELOG.md tests/installer_test.sh
          git diff --cached --check
          git commit -m 'release: v1.0.0 stable'
          git push origin HEAD:main

      - name: Build assets
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf dist
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/goedge-ip-cert-linux-amd64 ./cmd/goedge-ip-cert
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/goedge-ip-cert-linux-arm64 ./cmd/goedge-ip-cert
          cp install.sh dist/install.sh
          chmod 0755 dist/install.sh dist/goedge-ip-cert-linux-amd64 dist/goedge-ip-cert-linux-arm64
          test "$(dist/goedge-ip-cert-linux-amd64 version)" = 'v1.0.0'
          test "$(GOEDGE_IP_CERT_SOURCE_ONLY=0 dist/install.sh --version)" = 'v1.0.0'
          (cd dist && sha256sum goedge-ip-cert-linux-amd64 goedge-ip-cert-linux-arm64 install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create immutable tag
        shell: bash
        run: |
          set -Eeuo pipefail
          if git rev-parse 'refs/tags/v1.0.0' >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; refusing to rewrite it' >&2
            exit 1
          fi
          git tag -a v1.0.0 -m 'GoEdge IPv4 Cert Manager v1.0.0'
          git push origin v1.0.0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          notes=$'GoEdge IPv4 Cert Manager v1.0.0 is the first Stable release.\n\n- Lets Encrypt public IPv4 certificates using ACME ip identifier, shortlived profile and HTTP-01.\n- Same-Cert-ID automatic renewal through GoEdge REST.\n- Production unattended natural renewal proven with unchanged SSL Policy, isolated Node refresh and no order storm.\n- First-issuance failures pause in NEEDS_ATTENTION; hourly timer does not repeat first-issuance orders.\n- Menu 2 now explains that a newly created GoEdge IP website may need HTTPS / 443 saved once before discovery; no certificate needs to be selected before that save.\n- Stable updater ignores prereleases.\n\nScope remains IPv4-only. First certificate binding to the GoEdge SSL Policy is manual by design; Cert Manager keeps the Policy boundary read-only.'
          gh release create v1.0.0 \
            dist/goedge-ip-cert-linux-amd64 \
            dist/goedge-ip-cert-linux-arm64 \
            dist/install.sh \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v1.0.0 - Stable' \
            --notes "$notes" \
            --latest

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          summary=$(gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft,tagName --jq '.tagName + " " + (.isPrerelease|tostring) + " " + (.isDraft|tostring)')
          test "$summary" = 'v1.0.0 false false'
          rm -rf /tmp/v1-assets
          mkdir -p /tmp/v1-assets
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --dir /tmp/v1-assets
          (cd /tmp/v1-assets && sha256sum -c SHA256SUMS)
